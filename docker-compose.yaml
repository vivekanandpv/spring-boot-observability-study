services:
  spring-boot-observability-study:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/app/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=spring-boot-observability-study
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
    depends_on:
      - otel-collector
    networks:
      - observability-net

  observability-upstream:
    build:
      context: ./observability-upstream-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - JAVA_TOOL_OPTIONS=-javaagent:/app/opentelemetry-javaagent.jar
      - OTEL_SERVICE_NAME=observability-upstream
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - SERVER_PORT=8081
      - DOWNSTREAM_URL=http://spring-boot-observability-study:8080
    depends_on:
      - otel-collector
    networks:
      - observability-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0 # Loki exporter support vanished since version 0.109.0 (OTLP → Alloy → Loki seems to be the answer now 2025 October?)
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      - tempo
      - prometheus
      - loki
    networks:
      - observability-net

  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo-config.yaml"]
    volumes:
      - ./config/tempo-config.yaml:/etc/tempo-config.yaml
      - /tmp/tempo:/tmp/tempo
    ports:
      - "3200:3200"
    networks:
      - observability-net

  prometheus:
    image: prom/prometheus:v3.6.0
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - observability-net

  loki:
    image: grafana/loki:3.5
    ports:
      - "3100:3100"
    networks:
      - observability-net

  grafana:
    image: grafana/grafana:12.3.0-17718666199
    volumes:
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability-net

networks:
  observability-net:
    driver: bridge