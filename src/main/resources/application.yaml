spring:
  application:
    name: spring-boot-observability-study
  datasource:
    url: jdbc:h2:./app-db;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  otlp:
    metrics:
      export:
        url: http://otel-collector:4318/v1/metrics
        step: 10s
  tracing:
    enabled: true
    sampling:
      probability: 1.0  # 100% sampling for development, reduce it to <10% for production

logging:
  config: classpath:log4j2.yaml
  level:
    io.opentelemetry: INFO
    io.micrometer: INFO
    org.springframework.web: DEBUG
    root: INFO